<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Self-Healing Cloud Infrastructure</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --color_bg: #0c0a1d;
        --color_text: #f4f1ff;
        --color_muted: #bdb7e0;
        --color_line: #2f2960;
        --color_agent: #34f5a4;
        --color_fault: #ff4f7b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(48rem 30rem at 85% -6rem, rgba(110, 168, 255, 0.16), transparent 70%),
          var(--color_bg);
        color: var(--color_text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
      }
      .code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--color_fault);
      }
      h1 {
        margin: 12px 0 14px;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 28px;
        line-height: 1.6;
        color: var(--color_muted);
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--color_agent);
        color: var(--color_bg);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #ffe45c;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · NOT FOUND</p>
      <h1>This page went down and nothing brought it back.</h1>
      <p>The address may be mistyped, or the page never existed. The whole project lives on one page.</p>
      <a href="/">Back to the project</a>
    </main>
  </body>
</html>
